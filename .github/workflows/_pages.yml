# Reusable: the page. Deployed only when the page, the config or the scripts change (and once per
# monitor run, to refresh the fallback copy of the data): the live data is read by the page from the
# `status` branch, so a new check never needs a deployment (GitHub limits branch-based Pages builds to
# 10 per hour; deploying with these actions is not limited).
name: Pages (reusable)
on:
  workflow_call:
    inputs:
      config:
        type: string
        default: status.config.json
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test
        run: |
          python3 -I scripts/test_rollup.py
          python3 -I scripts/test_statuslib.py
          python3 -I scripts/test_e2e.py
      - name: Fetch the current data for the fallback copy
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          git fetch --quiet --depth 1 origin status && git archive FETCH_HEAD status.json view | tar -x -C "$RUNNER_TEMP/data" || echo "no data branch yet"
      - name: Build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/build_pages.py --config "${{ inputs.config }}" --out public --data-dir "$RUNNER_TEMP/data"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
